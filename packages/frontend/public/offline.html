<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoneOS — no connection</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#EDEAE4; color:#241F1A; font-family:'Space Grotesk',system-ui,sans-serif;
         background-image:radial-gradient(circle at 1px 1px, rgba(36,31,26,.06) 1px, transparent 0);
         background-size:18px 18px; padding:24px; }
  .card { background:#FBFAF7; border:1px solid #A79E8C; border-radius:4px; padding:26px 28px;
          max-width:380px; position:relative; }
  h1 { font-size:19px; margin:0 0 8px; }
  p { font-size:14px; line-height:1.6; color:#6B6255; margin:0 0 18px; }
  button { background:#8A5A32; color:#fff; border:0; border-radius:4px; padding:12px 20px;
           font:600 14px 'Space Grotesk',system-ui,sans-serif; cursor:pointer; min-height:44px; }
  .bar { height:6px; background:#A97142; border-radius:3px; width:64px; margin-bottom:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <h1>No connection</h1>
    <p>StoneOS needs a network to show current stock and production. Nothing you
       entered has been lost — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
