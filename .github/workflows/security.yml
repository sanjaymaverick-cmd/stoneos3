name: StoneOS Security

# Ported from the ston3gpt build (2026-09-02).
#
# This repo is PRIVATE and GitHub Advanced Security is not enabled, so the
# code-scanning API rejects SARIF uploads with "Resource not accessible by
# integration". The analysis itself works fine — CodeQL scanned all 101 TS
# files on the first run — so the scans stay and only the publishing of
# results is disabled or made non-fatal. Turn both back on in the same
# change that enables Advanced Security:
#   - CodeQL:  remove `upload: never`
#   - Trivy:   remove `continue-on-error` from the upload step
#
# What still HARD-FAILS the workflow, GHAS or not: Trivy finding a HIGH or
# CRITICAL fixable vulnerability, secret, or misconfiguration (exit-code 1),
# and CodeQL failing to analyse. Those are the real gates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoneos-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      # upload: never — the analysis runs and any failure to analyse still
      # fails this job; only publishing to the code-scanning UI is skipped,
      # because that API is unavailable without Advanced Security.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          upload: never

  supply-chain:
    name: Trivy and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      # Non-fatal for the same reason: the scan above is the gate, this step
      # only publishes what it found.
      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: stoneos-sbom.spdx.json
          output-file: stoneos-sbom.spdx.json
          upload-release-assets: false
