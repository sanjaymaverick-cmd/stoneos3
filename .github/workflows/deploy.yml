name: Deploy StoneOS

# Builds both container images, pushes them to ECR, and forces a new
# deployment of the two ECS Fargate services (backend + frontend) behind
# the ALB. See deploy/README.md for the full infrastructure layout.
#
# AWS auth is via GitHub OIDC (no long-lived access keys stored as
# secrets) — the workflow assumes the stoneos-github-deploy IAM role,
# which is scoped to ECR push + ECS update-service only.

on:
  push:
    branches: [main]
    # Docs-only changes don't need a full image rebuild + redeploy.
    paths-ignore:
      - "**/*.md"
      - "deploy/**"
      - ".gitignore"
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "REDACTED-AWS-ACCOUNT-ID"
  ECS_CLUSTER: stoneos-cluster

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED-AWS-ACCOUNT-ID:role/stoneos-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/stoneos-backend:${{ github.sha }} \
            -t $REGISTRY/stoneos-backend:latest \
            ./packages/backend
          docker push $REGISTRY/stoneos-backend:${{ github.sha }}
          docker push $REGISTRY/stoneos-backend:latest

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        # NEXT_PUBLIC_* values are baked in at build time (not read at
        # runtime). Both are public by design — the publishable key is a
        # client-side key and the API URL is the public ALB endpoint — so
        # they live in repo *variables*, not secrets.
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -t $REGISTRY/stoneos-frontend:${{ github.sha }} \
            -t $REGISTRY/stoneos-frontend:latest \
            ./packages/frontend
          docker push $REGISTRY/stoneos-frontend:${{ github.sha }}
          docker push $REGISTRY/stoneos-frontend:latest

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service stoneos-backend-svc \
            --force-new-deployment \
            --no-cli-pager

      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service stoneos-frontend-svc \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services stoneos-backend-svc stoneos-frontend-svc
