name: StoneOS CI

# Adapted from the ston3gpt build (2026-09-02). Differences from that repo:
#   - no deploy job; this project has no hosted environment
#   - no `?schema=` override on DATABASE_URL. The copilot RLS migration
#     (20260713000000) issues `GRANT USAGE ON SCHEMA public` and grants on
#     unqualified table names, so it only applies cleanly against the default
#     `public` schema. It also does `GRANT CONNECT ON DATABASE stoneos`, so the
#     service database MUST be named `stoneos`.
#   - frontend route-policy tests run on Node's built-in test runner
#     (node --test with native TS type-stripping), so they need no jest
#     setup and no Clerk credentials. This is why node-version is 24 and
#     not 20: type-stripping needs >= 22.6, and the runner's Node is what
#     executes the test, not the version in package.json. The Dockerfiles
#     are on the same major so CI tests what the images ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoneos-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://stoneos:stoneos_ci@127.0.0.1:5432/stoneos
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # Falls back to a well-formed dummy so CI is self-contained. Set the repo
  # secret to build against the real Clerk instance.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoneos
          POSTGRES_PASSWORD: stoneos_ci
          # Must stay `stoneos` — see the DATABASE_URL note above.
          POSTGRES_DB: stoneos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoneos -d stoneos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Report-only for now: this repo carries known-deprecated transitive deps
      # inherited from the Nest 10 tree. Flip to a hard gate once those are
      # cleaned up.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate --schema packages/backend/prisma/schema.prisma
          npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy --schema packages/backend/prisma/schema.prisma

      - name: Backend tests
        run: npm test --workspace=packages/backend

      - name: Backend build
        run: npm run build --workspace=packages/backend

      - name: Frontend typecheck
        run: npx tsc --noEmit -p packages/frontend/tsconfig.json

      - name: Frontend route-policy tests
        run: npm test --workspace=packages/frontend

      - name: Frontend production build
        run: npm run build --workspace=packages/frontend

  production-images:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build backend production image
        run: docker build -t stoneos-backend:ci ./packages/backend

      - name: Build frontend production image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          -t stoneos-frontend:ci ./packages/frontend
